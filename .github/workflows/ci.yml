name: Ruby CI

on:
  push:
    branches:
      - "v*"
  pull_request:
    branches:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rspec_files:
          - "spec/api spec/extensions spec/jobs spec/helpers spec/mailers spec/lib spec/models spec/views spec/controllers"
          - "spec/features/dashboard spec/features/surveyor"
          - "spec/features/proper spec/features/catalog_manager"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_ROOT_PASSWORD: ''
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      RAILS_ENV: test
      TZ: America/New_York
      DISPLAY: :99.0
      MOZ_HEADLESS: 1
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ''
      DATABASE_NAME: test_sparc_request
      FULFILLMENT_DATABASE_NAME: cwf_test

    steps:
      - name: Checkout sparc-request
        uses: actions/checkout@v4
        with:
          path: sparc-request

      - name: Checkout sparc-fulfillment
        uses: actions/checkout@v4
        with:
          repository: sparc-request/sparc-fulfillment
          ref: v3.6.1
          path: sparc-fulfillment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14.19.2

      - name: Install system dependencies and start Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mysql-client libcurl4-openssl-dev
          Xvfb :99 -screen 0 1024x768x24 &

      - name: Set up Ruby for sparc-request (3.3.1)
        uses: ruby/setup-ruby@v1
        id: setup_ruby_sparc
        with:
          working-directory: ./sparc-request

      - name: Set up Ruby for sparc-fulfillment (2.7.5)
        uses: ruby/setup-ruby@v1
        id: setup_ruby_cwf
        with:
          working-directory: ./sparc-fulfillment

      - name: Install dependencies and setup app
        env:
          SPARC_RUBY_PATH: ${{ steps.setup_ruby_sparc.outputs.ruby-path }}
          CWF_RUBY_PATH: ${{ steps.setup_ruby_cwf.outputs.ruby-path }}
        run: |
          echo "--- Installing sparc-fulfillment dependencies ---"
          (
            cd sparc-fulfillment
            export PATH="$CWF_RUBY_PATH/bin:$PATH"
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs=4 --retry=3
          )

          echo "--- Installing sparc-request dependencies ---"
          (
            cd sparc-request
            export PATH="$SPARC_RUBY_PATH/bin:$PATH"
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs=4 --retry=3
          )

          echo "--- Creating databases ---"
          mysql -h $DATABASE_HOST -u $DATABASE_USERNAME -e "create database $DATABASE_NAME;"
          mysql -h $DATABASE_HOST -u $DATABASE_USERNAME -e "create database $FULFILLMENT_DATABASE_NAME;"

          echo "--- Setting up sparc-request database ---"
          (
            cd sparc-request
            export PATH="$SPARC_RUBY_PATH/bin:$PATH"
            echo "Using Ruby: $(which ruby)"
            echo "Ruby version: $(ruby -v)"
            cp config/database.yml.example config/database.yml
            cp config/fulfillment_db.yml.example config/fulfillment_db.yml
            cp dotenv.example .env
            bundle exec rake db:schema:load
          )

          echo "--- Setting up sparc-fulfillment database ---"
          (
            cd sparc-fulfillment
            export BUNDLE_GEMFILE=$PWD/Gemfile
            export PATH="$CWF_RUBY_PATH/bin:$PATH"
            cp config/database.yml.example config/database.yml
            cp config/sparc_db.yml.example config/sparc_db.yml
            cp config/klok_db.yml.example config/klok_db.yml
            cp dotenv.example .env
            bundle exec rake db:schema:load
          )

          echo "--- Precompiling assets for sparc-request ---"
          (
            cd sparc-request
            export BUNDLE_GEMFILE=$PWD/Gemfile
            export PATH="$SPARC_RUBY_PATH/bin:$PATH"
            corepack enable
            yarn install
            bundle exec rake assets:precompile
          )

      - name: Run RSpec tests
        working-directory: ./sparc-request
        env:
          SPARC_RUBY_PATH: ${{ steps.setup_ruby_sparc.outputs.ruby-path }}
        run: |
          PATH=$SPARC_RUBY_PATH/bin:$PATH bundle exec rspec ${{ matrix.rspec_files }}
